name: Automated Release & Multi-Platform Build

on:
  workflow_dispatch:
    inputs:
      draft:
        description: 'Создать как черновик (Draft)'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Пометить как предварительный выпуск (Pre-release)'
        required: false
        default: false
        type: boolean

  push:
    branches:
      - main
      - master

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  # 1. Чтение текущей фиксированной версии проекта (без авто-бампа и без git push в ветку)
  prepare-release:
    name: 🔖 Определение версии релиза
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version-step.outputs.version }}
      tag: ${{ steps.version-step.outputs.tag }}
      target_sha: ${{ steps.version-step.outputs.target_sha }}
      should_release: ${{ steps.check-trigger.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Проверка необходимости публикации
        id: check-trigger
        run: |
          echo "should_release=true" >> $GITHUB_OUTPUT

      - name: Чтение версии из конфигурации проекта
        id: version-step
        run: |
          CURRENT_VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v$CURRENT_VER"
          TARGET_SHA=$(git rev-parse HEAD)
          echo "version=$CURRENT_VER" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "target_sha=$TARGET_SHA" >> $GITHUB_OUTPUT
          echo "Сборка выполняется для фиксированной версии: $CURRENT_VER (релиз: $TAG)"

  # 2. Кроссплатформенная матричная сборка (Windows, Linux, macOS)
  build-and-package:
    name: 📦 Сборка (${{ matrix.platform }})
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 (NSIS Installer + MSI + Portable Zip)
          - os: windows-latest
            platform: Windows x64
            target: x86_64-pc-windows-msvc

          # Linux x64 (DEB Installer + AppImage + Portable tar.gz)
          - os: ubuntu-22.04
            platform: Linux x64
            target: x86_64-unknown-linux-gnu

          # macOS Apple Silicon (DMG + Portable Zip)
          - os: macos-latest
            platform: macOS Apple Silicon (ARM64)
            target: aarch64-apple-darwin

          # macOS Intel (DMG + Portable Zip)
          - os: macos-latest
            platform: macOS Intel (x86_64)
            target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Установка системных зависимостей Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libasound2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            curl \
            tar \
            xz-utils

      - name: Установка Node.js зависимостей
        run: npm ci || npm install

      - name: Кеширование предустановленных ИИ-моделей
        uses: actions/cache@v4
        with:
          path: src-tauri/models
          key: ai-models-v2-${{ hashFiles('scripts/download-resources.cjs') }}
          restore-keys: |
            ai-models-v2-

      - name: Подготовка бинарных зависимостей (sidecars), моделей и иконок
        run: npm run pretauri:build
        env:
          TARGET: ${{ matrix.target }}

      - name: Подготовка окружения macOS (отключение Spotlight для стабильной упаковки DMG)
        if: runner.os == 'macOS'
        run: |
          sudo mdutil -a -i off || true

      - name: Сборка дистрибутивов через Tauri
        run: npx @tauri-apps/cli build --target ${{ matrix.target }} ${{ runner.os == 'macOS' && '--bundles app' || '' }}
        env:
          TARGET: ${{ matrix.target }}

      - name: Упаковка Установочных и Portable версий
        run: npm run package:portable
        env:
          TARGET: ${{ matrix.target }}

      - name: Показать созданные дистрибутивы
        shell: bash
        run: ls -la dist-releases

      - name: Выгрузка файлов сборки в артефакты GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist-releases/*
          if-no-files-found: error

  # 3. Финализация релиза: публикация/перезапись файлов в одном релизе текущей версии
  finalize-release:
    name: 🚀 Публикация в релиз ${{ needs.prepare-release.outputs.tag }}
    needs: [prepare-release, build-and-package]
    runs-on: ubuntu-latest
    if: needs.prepare-release.outputs.should_release == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Обновление тега ${{ needs.prepare-release.outputs.tag }} на текущий коммит
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ needs.prepare-release.outputs.tag }}"
          git tag -f -a "$TAG" "${{ needs.prepare-release.outputs.target_sha }}" -m "Release $TAG"
          git push origin "refs/tags/$TAG" --force || true

      - name: Скачивание всех собранных артефактов
        uses: actions/download-artifact@v4
        with:
          path: all-dist-releases
          pattern: dist-*
          merge-multiple: true

      - name: Список скачанных файлов релиза
        shell: bash
        run: |
          echo "=== СОДЕРЖИМОЕ all-dist-releases ==="
          ls -la all-dist-releases

      - name: Опубликовать или обновить релиз ${{ needs.prepare-release.outputs.tag }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: "Video Cutter Pro ${{ needs.prepare-release.outputs.tag }}"
          target_commitish: ${{ needs.prepare-release.outputs.target_sha }}
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            all-dist-releases/*
            all-dist-releases/**/*
          body: |
            ## 🎬 Video Cutter Pro ${{ needs.prepare-release.outputs.tag }}

            Автоматический многоплатформенный релиз Video Cutter Pro.
            Включает как стандартные установщики, так и полноценные **Portable (портативные)** версии, не требующие установки.

            ### 📦 Доступные файлы для скачивания:

            | Платформа | Установочная версия (Installer) | Портативная версия (Portable) |
            | :--- | :--- | :--- |
            | **Windows (x64)** | `.exe` (NSIS Setup) / `.msi` | `.zip` (Готовая папка с программой и sidecars) |
            | **Linux (x64)** | `.deb` (Debian/Ubuntu/Mint) | `.AppImage` / `.tar.gz` |
            | **macOS (Apple Silicon M1/M2/M3)** | `.dmg` | `.zip` (.app бандл) |
            | **macOS (Intel x64)** | `.dmg` | `.zip` (.app бандл) |

            ---
            *Сборка выполнена автоматически через GitHub Actions CI/CD.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
