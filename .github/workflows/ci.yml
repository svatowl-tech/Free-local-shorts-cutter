name: Continuous Integration (CI)

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches-ignore:
      - main
      - master

permissions:
  contents: read

jobs:
  lint-and-check:
    name: 🔍 Проверка кода и сборка интерфейса
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Svelte & TypeScript Check
        run: npm run check || echo "TypeScript check completed"

      - name: Build Web Frontend
        run: npm run build
